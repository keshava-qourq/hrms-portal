components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    users:
      type: object
      properties:
        id:
          type: string
          format: uuid
        employee_id:
          type: string
          format: uuid
        email:
          type: string
        password_hash:
          type: string
        must_change_password:
          type: boolean
        is_active:
          type: boolean
        failed_login_count:
          type: integer
        locked_at:
          type: string
          format: date-time
        last_login_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
      required:
      - id
      - email
      - password_hash
      - must_change_password
      - is_active
      - failed_login_count
      - created_at
    roles:
      type: object
      properties:
        id:
          type: string
        code:
          type: string
        name:
          type: string
      required:
      - id
      - code
      - name
    user_roles:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        role_id:
          type: string
        granted_at:
